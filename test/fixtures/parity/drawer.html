<button class="ins-btn ins-btn--secondary" data-ins-dialog="#drawer-filters"><svg class="ico"><use href="#i-sliders"/></svg>التصفية</button>
<button class="ins-btn ins-btn--secondary" data-ins-dialog="#drawer-order">تفاصيل الطلب</button>

<dialog class="ins-drawer" id="drawer-filters">

    <h3 class="ins-dialog-title">تصفية المنتجات</h3>
    <button class="ins-close" data-ins-dismiss aria-label="إغلاق"></button>

      <label class="ins-label" for="dr-cat">الفئة</label>

    </div>
    <label class="ins-check"><input type="checkbox" checked><span class="ins-check-text">المتوفّر فقط</span></label>
    <label class="ins-check"><input type="checkbox"><span class="ins-check-text">عليه خصم</span></label>

  <div class="ins-dialog-foot">

</dialog>
<dialog class="ins-drawer ins-drawer--end" id="drawer-order">
  <div class="ins-dialog-head">
    <h3 class="ins-dialog-title">الطلب <span class="ins-num">#40218</span></h3>
    <button class="ins-close" data-ins-dismiss aria-label="إغلاق"></button>
  </div>
  <div class="ins-dialog-body">
    <dl class="ins-prose ins-m-0">
      <dt>العميل</dt><dd>ليلى حسن</dd>

      <dt>الحالة</dt><dd><span class="ins-pill ins-pill--info"><span class="ins-pill-dot"></span>قيد التجهيز</span></dd>
    </dl>
  </div>
</dialog>
<dialog class="ins-drawer ins-drawer--bottom" id="drawer-share">
  <div class="ins-dialog-head">
    <h3 class="ins-dialog-title">مشاركة المنتج</h3>
    <button class="ins-close" data-ins-dismiss aria-label="إغلاق"></button>

  <div class="ins-dialog-body">
    <div class="ins-row">
      <button class="ins-btn ins-btn--secondary" data-ins-dismiss><svg class="ico"><use href="#i-copy"/></svg>نسخ الرابط</button>
      <button class="ins-btn ins-btn--secondary" data-ins-dismiss><svg class="ico"><use href="#i-mail"/></svg>بالبريد</button>
