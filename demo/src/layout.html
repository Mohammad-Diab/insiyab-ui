  <title>{{DOC_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">

  <!-- The library: two tags, and nothing else of it is needed. -->
  <link rel="stylesheet" href="../dist/insiyab.css">
  <script src="../dist/insiyab.js"></script>

  <!-- One plugin, the command palette: the search below is built by it. -->
  <link rel="stylesheet" href="../dist/plugins/insiyab-palette.css">
  <script src="../dist/plugins/insiyab-palette.js"></script>

  <!-- And the scrollspy plugin, for each page's contents list. -->
  <link rel="stylesheet" href="../dist/plugins/insiyab-scrollspy.css">
  <script src="../dist/plugins/insiyab-scrollspy.js"></script>

  <!-- The documentation site's own furniture — code listings, the pager.
       Nothing in it is part of the library. -->
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
</head>

<div class="ins-shell">

  <!-- ============================================================ sidebar -->
  <aside class="ins-shell-side" id="nav" aria-label="أقسام التوثيق">
    <a class="ins-shell-brand" href="index.html">
      <span class="ins-shell-mark">ان</span>
      <span class="ins-shell-brand-text">
        <span class="ins-shell-brand-name">انسياب</span>
        <span class="ins-shell-brand-role">التوثيق · <span class="ins-num">{{VERSION}}</span></span>
      </span>
    </a>

{{SIDEBAR}}
  </aside>
  <div class="ins-shell-scrim"></div>

  <div class="ins-shell-main">

    <!-- ========================================================== top bar -->
    <!-- The Dorak arrangement: the menu and a context island at the start, the
         page's name centred with search beside it, the viewer's own controls at
         the end. -->
    <header class="ins-topbar">
      <div class="ins-zone ins-zone--start">
        <button class="ins-island ins-island--icon" data-ins-sidebar aria-label="القائمة" data-ins-tip data-ins-tip-side="bottom">
          <svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <a class="ins-island ins-island--brand" href="index.html">
          <span class="ins-shell-mark" style="--ins-mark:28px;font-size:.8125rem">ان</span>
          <b>انسياب</b>
        </a>
        <span class="ins-island site-version ins-hide-below-md">الإصدار <span class="ins-num">{{VERSION}}</span></span>
      </div>

      <div class="ins-zone ins-zone--center">
        <div class="ins-island ins-island--title">
          <div class="ins-shell-head">{{TITLE}}</div>
        </div>
        <button class="ins-island ins-island--icon" data-ins-dialog="#site-search" aria-label="بحث في التوثيق" aria-keyshortcuts="Control+K /" data-ins-tip data-ins-tip-side="bottom">
          <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
        </button>
      </div>

      <div class="ins-zone ins-zone--end">
        <button class="ins-island ins-island--icon site-theme" data-ins-theme-toggle aria-label="تبديل الوضع" data-ins-tip data-ins-tip-side="bottom">
          <svg class="ico site-theme-moon" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="ico site-theme-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
        <details class="ins-pop ins-pop--end site-custom">
          <summary class="ins-island site-custom-btn" aria-label="تخصيص المظهر">
            <span class="site-custom-dot" aria-hidden="true"></span>
            <span class="site-custom-text ins-hide-below-sm">المظهر</span>
            <svg class="ico site-custom-chev" aria-hidden="true"><use href="#i-chev-down"/></svg>
          </summary>
          <div class="ins-pop-body ins-pop-body--card site-custom-body">
            <div class="ins-pop-label">لون الهوية</div>
            <div class="site-swatches">
              <button class="site-swatch" data-brand="#0F766E" style="--c:#0F766E" aria-label="أخضر مزرق" data-ins-tip></button>
              <button class="site-swatch" data-brand="#1D4ED8" style="--c:#1D4ED8" aria-label="أزرق" data-ins-tip></button>
              <button class="site-swatch" data-brand="#9B2C5E" style="--c:#9B2C5E" aria-label="عنّابي" data-ins-tip></button>
              <button class="site-swatch" data-brand="#4C1D95" style="--c:#4C1D95" aria-label="بنفسجي" data-ins-tip></button>
              <button class="site-swatch" data-brand="#B45309" style="--c:#B45309" aria-label="كهرماني" data-ins-tip></button>
              <button class="site-swatch" data-brand="#C9A063" style="--c:#C9A063" aria-label="ذهبي فاتح" data-ins-tip></button>
            </div>
            <div class="ins-pop-label">اتجاه الصفحة</div>
            <div class="ins-seg site-dir">
              <button type="button" data-dir="rtl">عربي · RTL</button>
              <button type="button" data-dir="ltr">LTR</button>
            </div>
            <hr class="ins-pop-sep">
            <button class="ins-pop-item" data-ins-fx>تخفيف المؤثرات</button>
            <button class="ins-pop-item" data-ins-theme-toggle="system">اتبع وضع النظام</button>
            <button class="ins-pop-item" data-site-reset>إعادة الضبط</button>
          </div>
        </details>
      </div>
    </header>

    <main class="ins-shell-content">
      <div class="site-page">
        <div class="site-body">
        {{HEAD}}
        {{CONTENT}}
        {{PAGER}}
        </div>
        {{TOC}}
      </div>
    </main>
  </div>
</div>

<!-- ============================================================== search -->
<!-- The command palette plugin: every page from the sidebar, read from it when the
     palette opens (each link carries its English name as a keyword), and one action. -->
<dialog class="ins-dialog ins-palette" id="site-search" data-ins-palette data-ins-palette-from=".ins-shell-side"
        data-ins-palette-placeholder="ابحث عن مكوّن: زر، جدول، حوار… أو بالإنجليزية" aria-label="بحث في التوثيق">
  <div data-ins-palette-group="إجراءات">
    <button data-ins-theme-toggle data-keywords="dark light theme mode داكن فاتح"><svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg>تبديل الوضع الداكن</button>
  </div>
</dialog>

</body>
</html>
